<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid — cymatic water from sound</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23aeb8bf'/%3E%3Cpath d='M16 6c5 4 8 7 8 11a8 8 0 0 1-16 0c0-4 3-7 8-11z' fill='%2312181d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=e10531ff">

<div id="app">
  <div id="stage"></div>

  <!-- Separate floating pills rather than one full-width bar, so the canvas
       stays visible behind and drag works in the gaps between them. -->
  <div id="top-bar">
    <span class="brand">LIQUID</span>

    <div id="audio-controls">
      <button id="btn-mic" class="btn-icon" title="Record from microphone" aria-label="Record from microphone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0"/><path d="M12 17v3.5"/></svg>
      </button>
      <label id="lbl-file" class="btn-icon" title="Upload audio file" aria-label="Upload audio file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.2l2 2h7.8a2 2 0 0 1 2 2v6.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
        <input type="file" id="file" accept="audio/*" hidden>
      </label>
      <button id="btn-live" class="btn-icon" title="Live mode" aria-label="Start live mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4"/><path d="M4.9 4.9a10 10 0 0 0 0 14.2"/><path d="M19.1 4.9a10 10 0 0 1 0 14.2"/></svg>
      </button>
      <button id="btn-stop" class="btn-icon" title="Stop capture" aria-label="Stop capture" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
      </button>
      <button id="btn-submit" class="btn-icon btn-submit" title="Create design" aria-label="Create design" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
      <button id="btn-rec" class="btn-icon" title="Record video" aria-label="Record video" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-rec-stop" class="btn-icon" title="Stop video" aria-label="Stop video" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
      </button>
      <button id="btn-clear" class="btn-icon btn-clear" title="Clear" aria-label="Clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15"/><path d="M9.5 7V5.8A1.8 1.8 0 0 1 11.3 4h1.4a1.8 1.8 0 0 1 1.8 1.8V7"/><path d="M6.5 7l.7 10.7a2 2 0 0 0 2 1.8h5.6a2 2 0 0 0 2-1.8L17.5 7"/></svg>
      </button>
    </div>

    <div id="export-btns">
      <button data-export="png">PNG</button>
      <button data-export="flat-svg">Flat SVG</button>
      <button data-export="flat-pdf">Flat PDF</button>
      <button data-export="outline-svg">Outline SVG</button>
      <button data-export="outline-pdf">Outline PDF</button>
    </div>
  </div>

  <div id="vu-track" hidden><div id="vu"></div></div>
  <div id="status">Ready</div>

  <div id="video-ready" hidden>
    <span>Video ready</span>
    <select id="sel-video-q">
      <option value="original" selected>Original</option>
      <option value="1080high">1080p high</option>
      <option value="1080med">1080p medium</option>
      <option value="720">720p</option>
    </select>
    <button id="btn-video-export">Export</button>
    <button id="btn-video-discard" class="ghost">Discard</button>
  </div>

  <aside id="panel">
    <details open>
      <summary>Water</summary>
      <label>Gloss<input type="range" id="sl-gloss" min="0" max="2" step="0.05" value="1"></label>
      <label>Dispersion<input type="range" id="sl-dispersion" min="0" max="2.5" step="0.05" value="1"></label>
      <label>Rim<input type="range" id="sl-rim" min="0" max="3" step="0.05" value="1"></label>
      <label>Depth<input type="range" id="sl-depth" min="0" max="2.5" step="0.05" value="1"></label>
      <label>Refraction<input type="range" id="sl-refract" min="0" max="3" step="0.05" value="1"></label>
      <label>Flow<input type="range" id="sl-flow" min="0" max="1" step="0.02" value="0.35"></label>
      <label>Nodal detail — cells per figure<input type="range" id="sl-simple" min="0" max="1" step="0.02" value="0"></label>
      <label>Swell<input type="range" id="sl-swell" min="0" max="1" step="0.02" value="0"></label>
      <label>Mass — web to islands<input type="range" id="sl-mass" min="0" max="1" step="0.02" value="0"></label>
      <!-- Two explicit generators, not a blend. A slider between them produced
           shapes that belonged to neither. -->
      <label>Pattern style
        <select id="sel-mode">
          <option value="cymatic" selected>Detailed Cymatic</option>
          <option value="meta">Metaball Cymatic</option>
        </select>
      </label>
      <label>Motion<input type="range" id="sl-motion" min="0" max="1" step="0.02" value="0.35"></label>
      <label>View
        <select id="sel-view">
          <option value="0" selected>Water</option>
          <option value="1">Flat fill (what Flat SVG emits)</option>
          <option value="2">Outline (what Outline SVG emits)</option>
        </select>
      </label>
      <label>Line weight<input type="range" id="sl-linew" min="0.003" max="0.05" step="0.001" value="0.012"></label>
    </details>

    <details open id="meta-group">
      <summary>Metaball Cymatic</summary>
      <p class="hint tight">Used by the Metaball Cymatic pattern style.</p>
      <label>Circle count<input type="range" id="sl-m-count" min="0" max="1" step="0.02" value="0.45"></label>
      <label>Cymatic order<input type="range" id="sl-m-order" min="0" max="1" step="0.02" value="0.40"></label>
      <label>Merge<input type="range" id="sl-m-merge" min="0" max="1" step="0.02" value="0.50"></label>
      <label>Spacing<input type="range" id="sl-m-spacing" min="0" max="1" step="0.02" value="0.50"></label>
      <label>Size variation<input type="range" id="sl-m-sizevar" min="0" max="1" step="0.02" value="0.50"></label>
      <label>Roundness / Stretch<input type="range" id="sl-m-stretch" min="0" max="1" step="0.02" value="0.25"></label>
      <label>Symmetry<input type="range" id="sl-m-symmetry" min="0" max="1" step="0.02" value="0.50"></label>
      <label>Scale / crop<input type="range" id="sl-m-crop" min="0.5" max="2" step="0.05" value="1"></label>
      <button id="btn-reroll" class="wide">Reroll composition</button>
    </details>

    <details open>
      <summary>View</summary>
      <label>Preview zoom<input type="range" id="sl-scale" min="0.35" max="4" step="0.05" value="1"></label>
      <button id="btn-reset-view" class="wide">Reset view</button>
      <p class="hint tight">Scroll or pinch to scale · drag to move · double-click to reset</p>
    </details>

    <details open>
      <summary>Colour</summary>
      <label class="swatch">Ground<input type="color" id="col-ground" value="#aeb8bf"></label>
      <label class="swatch">Ink<input type="color" id="col-ink" value="#12181d"></label>
      <label class="swatch">Depth<input type="color" id="col-deep" value="#7d94a6"></label>
      <label class="check" id="lbl-backdrop">Backdrop image (the water refracts it)
        <input type="file" id="file-backdrop" accept="image/*" hidden>
      </label>
      <button id="btn-backdrop-clear" class="wide">Remove backdrop</button>
    </details>

    <details>
      <summary>Export</summary>
      <label>Resolution
        <select id="sel-res">
          <option value="1600" selected>1600 px</option>
          <option value="2400">2400 px</option>
          <option value="3840">3840 px</option>
          <option value="7680">7680 px</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="chk-transparent"> Transparent background</label>
    </details>

    <p class="hint">Live holds the last design and shimmers.<br>A submitted recording is one static image.</p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/vendor/mp4-muxer.min.js?v=e10531ff"></script>
<script type="module" src="js/app.js?v=e10531ff"></script>
